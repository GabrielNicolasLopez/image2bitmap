<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>image2bitmap</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <h1>image2bitmap</h1>
      </div>
      <div class="topbar-actions">
        <button id="undoBtn" class="icon-btn" title="Undo" aria-label="Undo">↶</button>
        <button id="redoBtn" class="icon-btn" title="Redo" aria-label="Redo">↷</button>
        <button id="resetAllBtn" class="secondary-btn">Limpiar</button>
      </div>
    </header>

    <main class="layout">
      <section class="panel controls-panel">
        <div class="panel-header">
          <h2>Controles</h2>
        </div>

        <div class="control-block">
          <label class="file-input-label" for="imageInput">Subir imagen</label>
          <div class="file-picker">
            <input id="imageInput" class="file-input" type="file" accept="image/*" />
            <label class="file-picker-button" for="imageInput">Elegir imagen</label>
            <span id="imageInputName" class="file-picker-name">Ningún archivo seleccionado</span>
          </div>
        </div>

        <div class="control-block">
          <label>
            <span>Umbral</span>
            <input id="thresholdInput" type="range" min="0" max="255" value="128" />
          </label>
          <div class="inline-row compact">
            <span id="thresholdValue" class="badge">128</span>
            <button id="autoThresholdBtn" class="secondary-btn small-btn">Auto</button>
          </div>
        </div>

        <div class="control-block">
          <p class="hint">Shift + flechas mueve todos los píxeles en esa dirección.</p>
        </div>

      </section>

      <section class="panel preview-panel">
        <div class="panel-header panel-header-stack">
          <div>
            <h2>Vista previa</h2>
          </div>
          <div class="preview-side-controls">
            <label>
              <span>Ancho destino</span>
              <input id="widthInput" type="number" min="1" max="512" value="64" />
            </label>
            <label>
              <span>Alto destino</span>
              <input id="heightInput" type="number" min="1" max="512" value="64" />
            </label>
            <label class="checkbox-chip">
              <input id="invertInput" type="checkbox" />
              <span>Invertir blanco / negro</span>
            </label>
            <label>
              <span>Zoom grilla</span>
              <input id="zoomInput" type="range" min="4" max="28" value="7" />
            </label>
            <span id="zoomValue" class="badge">7x</span>
          </div>
        </div>

        <div class="preview-grid two-cols">
          <div class="preview-card">
            <div class="preview-card-header">
              <h3>Imagen original</h3>
              <span id="originalMeta" class="muted">Sin imagen</span>
            </div>
            <div class="preview-stage centered original-stage">
              <span id="originalEmptyState" class="original-empty-state">Ningún archivo seleccionado</span>
              <img id="originalPreview" alt="Vista previa de imagen original" />
            </div>
          </div>

          <div class="preview-card editor-card">
            <div class="preview-card-header">
              <h3>Bitmap</h3>
              <span id="editorMeta" class="muted">64 × 64</span>
            </div>
            <div class="editor-wrap">
              <canvas id="editorCanvas" width="640" height="640"></canvas>
            </div>
          </div>
        </div>
      </section>

      <section class="panel output-panel">
        <div class="panel-header">
          <div>
            <h2>Bitmap generado</h2>
          </div>
        </div>
        <div class="output-card">
          <div class="output-toolbar">
            <div class="output-settings">
              <label class="output-setting">
                <span>Nombre de variable</span>
                <input id="variableNameInput" type="text" value="bitmap" />
              </label>
              <label class="output-setting output-setting-small">
                <span>Bytes por línea</span>
                <input id="bytesPerLineInput" type="number" min="4" max="64" value="16" />
              </label>
            </div>
            <button id="copyBitmapBtn" class="primary-btn">Copiar bitmap</button>
          </div>
          <div class="output-wrap">
            <textarea id="bitmapOutput" spellcheck="false"></textarea>
          </div>
        </div>
      </section>
    </main>
  </div>

  <canvas id="hiddenWorkCanvas" class="hidden-canvas"></canvas>
  <script src="app.js"></script>
</body>
</html>
